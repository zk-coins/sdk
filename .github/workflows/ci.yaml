name: CI

on:
  # ---------------------------------------------------------------------
  # PAUSED on pull requests — on purpose.
  #
  # The v1 work is being developed and verified locally; hosted CI is
  # deliberately out of the loop until it is finished, and is then switched
  # back on as the last step before the branch is offered for review.
  #
  # To bring it back: delete this block and uncomment the `pull_request:`
  # line below, which is left verbatim so re-enabling is a deletion rather
  # than a rewrite. Nothing else changed — every job and step is untouched.
  #
  # `push` on develop/main is left active: those branches are not touched by
  # the feature work, so it costs nothing and keeps the release path honest.
  # `workflow_dispatch` stays for a run started by hand.
  # ---------------------------------------------------------------------
  # pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: ESLint + Prettier
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build (tsup ESM + CJS + .d.ts)
        run: npm run build

      - name: Confirm dist exists
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts

  test:
    name: Unit Tests + Coverage
    needs: lint-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Vitest with 100% coverage gate
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 7

  cross-tests:
    name: Cross-tests (JS ↔ Rust reference)
    needs: lint-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # Hard requirement: the shim is the load-bearing DoD §6(b) parity
      # gate. A missing Cargo.toml is a failure, never a skip — a gate
      # that cannot go red is not a gate.
      - name: Require cross-rust shim sources
        run: |
          if [ ! -f test/cross-rust/shim/Cargo.toml ]; then
            echo "::error::test/cross-rust/shim/Cargo.toml is missing. Node↔SDK parity (DoD §6(b)) cannot run. See test/cross-rust/README.md."
            exit 1
          fi
          if [ ! -f test/cross-rust/cross.test.ts ]; then
            echo "::error::test/cross-rust/cross.test.ts is missing. Parity suite is incomplete."
            exit 1
          fi
          echo "cross-rust shim sources present"

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + shim build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            test/cross-rust/shim/target
          key: cross-shim-${{ runner.os }}-${{ hashFiles('test/cross-rust/shim/Cargo.toml') }}

      - run: npm ci

      - name: Build Rust shim
        working-directory: test/cross-rust/shim
        run: cargo build --release

      - name: Run cross-tests
        run: npm run test:cross
